# Disposable Paper server for Milestone 3 live verification.
# It does not start Village Alpha or the survival server.
# Game 127.0.0.1:25567, RCON 127.0.0.1:25577.
name: village-m3-smoke
services:
  village:
    image: itzg/minecraft-server:java21
    container_name: village-m3-smoke
    ports:
      - "127.0.0.1:25567:25565"
      - "127.0.0.1:25577:25575"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.6"
      MEMORY: "4G"
      ONLINE_MODE: "FALSE"
      MODE: survival
      DIFFICULTY: normal
      FORCE_GAMEMODE: "true"
      MAX_PLAYERS: "20"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      SPAWN_PROTECTION: "0"
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${VILLAGE_M3_RCON_PASSWORD:?Set VILLAGE_M3_RCON_PASSWORD in services/village-m3-smoke/.env}"
      MOTD: "Village M3 smoke"
      LEVEL: world
      ENABLE_COMMAND_BLOCK: "false"
      USE_AIKAR_FLAGS: "true"
      STOP_SERVER_ANNOUNCE_DELAY: "0"
      UID: "1000"
      GID: "1000"
    volumes:
      - ${VILLAGE_M3_DATA_DIR:?Set VILLAGE_M3_DATA_DIR in services/village-m3-smoke/.env}:/data
    restart: "no"
